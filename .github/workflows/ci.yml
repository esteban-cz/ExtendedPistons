name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (NeoForge ${{ matrix.neoforge }}, Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        neoforge:
          - 21.1.1
          - 21.1.233
          - 21.1.234

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Allow Gradle wrapper execution
        run: chmod +x gradlew

      - name: Run focused tests
        run: ./gradlew --no-daemon -Pneo_version=${{ matrix.neoforge }} test

      - name: Run dedicated-server GameTests
        run: ./gradlew --no-daemon -Pneo_version=${{ matrix.neoforge }} runGameTestServer

      - name: Build release JAR
        run: ./gradlew --no-daemon -Pneo_version=${{ matrix.neoforge }} build

      - name: Upload built JAR
        uses: actions/upload-artifact@v7
        with:
          name: extendedpistons-neoforge-${{ matrix.neoforge }}-${{ github.sha }}
          path: build/libs/extendedpistons-*.jar
          if-no-files-found: error
          retention-days: 14
